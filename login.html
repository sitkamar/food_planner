<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Planner – Přihlášení</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
      :root {
        --bg: #f3f7f4;
        --panel: #ffffff;
        --primary: #2f7d5b;
        --primary-dark: #245f46;
        --text: #1d2a22;
        --muted: #678176;
        --border: #dfece4;
        --danger: #b33a2c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #edf6ef 0%, #eef4f0 100%);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 12px 36px rgba(29, 42, 34, 0.08);
        padding: 28px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: var(--primary);
        color: white;
      }

      h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }

      .subtitle {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .switcher {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
      }

      .switcher button {
        background: #edf3ef;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .switcher button.active {
        background: var(--primary);
        color: white;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        background: var(--primary);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { background: var(--primary-dark); }

      .message {
        min-height: 22px;
        margin-top: 14px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .message.error { color: var(--danger); }
      .message.success { color: var(--primary-dark); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="brand-mark">FP</div>
        <div>
          <h1>Food Planner</h1>
        </div>
      </div>

      <p class="subtitle">Přístup je omezen na pozvané e-maily.</p>

      <div class="switcher" aria-label="Přepínání typu přihlášení">
        <button id="loginTab" class="active" type="button">Přihlásit se</button>
        <button id="signupTab" type="button">Vytvořit účet</button>
      </div>

      <form id="authForm">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="vas-email@example.com" required />

        <label for="password">Heslo</label>
        <input id="password" name="password" type="password" placeholder="Minimálně 6 znaků" required />

        <button id="submitBtn" type="submit">Přihlásit se</button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>
    </main>

    <script>
      const authForm = document.getElementById('authForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const message = document.getElementById('message');
      const loginTab = document.getElementById('loginTab');
      const signupTab = document.getElementById('signupTab');
      const submitBtn = document.getElementById('submitBtn');
      let currentMode = 'login';

      function setMessage(text, type = '') {
        message.textContent = text;
        message.className = 'message';
        if (type) {
          message.classList.add(type);
        }
      }

      function setMode(mode) {
        currentMode = mode;
        const isLogin = mode === 'login';

        loginTab.classList.toggle('active', isLogin);
        signupTab.classList.toggle('active', !isLogin);
        submitBtn.textContent = isLogin ? 'Přihlásit se' : 'Vytvořit účet';
        setMessage(isLogin ? 'Přihlaste se pomocí e-mailu a hesla.' : 'Vytvořte si účet pouze pro pozvané e-maily.');
      }

      async function initSupabase() {
        const response = await fetch('/api/config');
        const config = await response.json();

        if (!config.supabaseUrl || !config.supabasePublishableKey) {
          throw new Error('Supabase URL nebo publishable key chybí. Nastav je v .env souboru.');
        }

        return window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        });
      }

      async function verifyInvitation(email) {
        const response = await fetch('/api/check-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.message || 'E-mail není oprávněn k přístupu.');
        }

        return payload;
      }

      async function checkExistingSession() {
        try {
          const supabase = await initSupabase();
          const { data: { session } } = await supabase.auth.getSession();

          if (session) {
            const accessCheck = await fetch('/api/access-check', {
              headers: {
                Authorization: `Bearer ${session.access_token}`
              }
            });

            if (accessCheck.ok) {
              window.location.href = '/';
              return;
            }
          }
        } catch (error) {
          console.error(error);
        }
      }

      loginTab.addEventListener('click', () => setMode('login'));
      signupTab.addEventListener('click', () => setMode('signup'));

      authForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          setMessage('Zadejte e-mail i heslo.', 'error');
          return;
        }

        if (password.length < 6) {
          setMessage('Heslo musí mít alespoň 6 znaků.', 'error');
          return;
        }

        setMessage('Ověřuji přístup a připravuji přihlášení...', '');

        try {
          await verifyInvitation(email);

          const supabase = await initSupabase();

          let result;
          if (currentMode === 'signup') {
            // pro invite-only instance vytvoříme účet přes server (service role)
            const resp = await fetch('/api/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });

            const payload = await resp.json();
            if (!resp.ok) {
              throw new Error(payload.message || 'Nepodařilo se vytvořit účet.');
            }

            setMessage('Účet byl vytvořen. Nyní se můžete přihlásit.', 'success');
            setTimeout(() => window.location.href = '/', 900);
            return;
          }

          try {
            result = await supabase.auth.signInWithPassword({ email, password });
            if (result.error) {
              throw result.error;
            }

            setMessage('Přihlášení proběhlo úspěšně. Přesměrování...', 'success');
            setTimeout(() => window.location.href = '/', 900);
            return;
          } catch (signInError) {
            // Pokud přihlášení selže a server-side registrace je možná, zkusíme vytvořit účet přes server
            const resp = await fetch('/api/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });

            const payload = await resp.json();
            if (!resp.ok) {
              throw signInError;
            }

            setMessage('Účet neexistoval, byl vytvořen serverově. Nyní se můžete přihlásit.', 'success');
            setTimeout(() => window.location.href = '/', 900);
            return;
          }
        } catch (error) {
          setMessage(error.message || 'Přihlášení se nepodařilo.', 'error');
        }
      });

      setMode('login');
      checkExistingSession();
    </script>
  </body>
</html>
